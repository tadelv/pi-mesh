name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version` input: the action reads packageManager from
      # package.json. Passing both makes the action fail with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      # Type-checks tests too. The build only covers src/, and vitest strips
      # types, so without this step compile-time assertions in tests - and
      # plain type errors in tests - are never checked by anything.
      - run: pnpm typecheck
      - run: pnpm -r --if-present test
      - run: pnpm -r --if-present lint
      - run: pnpm format:check
