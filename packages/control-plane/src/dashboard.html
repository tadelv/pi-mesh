<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Pi Mesh Control Plane</title>
  <style>
    :root {
      color-scheme: light;
      --line-height: 18px;
      --sidebar-width: 300px;
      --agents-width: 360px;
      --body-bg: #f5f6f7;
      --container-bg: #fff;
      --info-bg: #edf0f2;
      --text: #20262b;
      --dim: #56616a;
      --muted: #697680;
      --accent: #176b86;
      --selectedBg: #dcecf1;
      --userMessageBg: #e7f0f3;
      --userMessageText: #20262b;
      --assistantBg: transparent;
      --toolPendingBg: #edf0f2;
      --toolSuccessBg: #e8f2ed;
      --toolErrorBg: #f8e9e7;
      --warning: #76500a;
      --error: #a32d22;
      --success: #286341;
      --border: #cbd1d5;
      --focus: #176b86;
      --font-ui: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      --font-mono: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, 'DejaVu Sans Mono', monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --body-bg: #1c2023;
        --container-bg: #24292d;
        --info-bg: #2b3135;
        --text: #e4e8ea;
        --dim: #b3bdc3;
        --muted: #9ba7ae;
        --accent: #82c9df;
        --selectedBg: #303d42;
        --userMessageBg: #29383e;
        --userMessageText: #e4e8ea;
        --assistantBg: transparent;
        --toolPendingBg: #292f33;
        --toolSuccessBg: #263730;
        --toolErrorBg: #3b2c2b;
        --warning: #edc879;
        --error: #ff9589;
        --success: #8ad1a5;
        --border: #424b50;
        --focus: #82c9df;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--body-bg);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 13px;
      line-height: 19px;
      -webkit-font-smoothing: antialiased;
    }
    ::selection { background: var(--selectedBg); color: var(--text); }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    button, input, textarea, select { font: inherit; color: inherit; }
    button {
      min-height: 30px;
      padding: 5px 11px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--container-bg);
      cursor: pointer;
    }
    button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    button:disabled { opacity: .55; cursor: not-allowed; }
    input, textarea, select {
      min-height: 30px;
      padding: 5px 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--body-bg);
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }
    textarea { min-height: 64px; resize: vertical; }
    a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
    .topbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 52px;
      padding: 8px 14px;
      background: var(--container-bg);
      border-bottom: 1px solid var(--border);
    }
    .topbar button { flex-shrink: 0; white-space: nowrap; }
    .topbar .nav-btn { display: none; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 15px; line-height: 21px; font-weight: 650; }
    h2 { font-size: 15px; line-height: 21px; font-weight: 650; }
    h3 { font-size: 13px; line-height: 19px; font-weight: 600; }
    .topbar h1 { margin-right: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .workspace {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr) var(--agents-width);
      overflow: hidden;
    }
    .sidebar, .agents-pane {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: var(--container-bg);
    }
    .sidebar { border-right: 1px solid var(--border); }
    .agents-pane { border-left: 1px solid var(--border); }
    .sidebar-head { flex: 0 0 auto; padding: 12px; border-bottom: 1px solid var(--border); }
    .sidebar-head label { display: block; margin-bottom: 5px; color: var(--dim); }
    #search { width: 100%; }
    #session-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 4px 0; }
    .session-link {
      display: block;
      width: 100%;
      min-height: 0;
      padding: 7px 12px;
      border: 0;
      border-radius: 0;
      text-align: left;
      background: transparent;
      color: var(--text);
    }
    .session-link:hover, .session-link[aria-current="true"] { background: var(--selectedBg); color: var(--text); }
    .session-name, .session-project { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .session-name { font-weight: 700; }
    .session-project, .session-age, .dim { color: var(--dim); }
    .agent-label { padding: 9px 12px 4px; color: var(--muted); border-top: 1px solid var(--border); }
    .empty { padding: 12px; color: var(--dim); }
    .content {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }
    .content-head { flex: 0 0 auto; padding: 10px 18px 0; }
    .content-head > :empty { display: none; }
    #agents { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 0 14px 28px; }
    #transcript-panel {
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 0 18px;
    }
    #transcript-panel > * { flex: 0 0 auto; }
    #transcript-panel > .transcript { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; }
    .composer-dock {
      flex: 0 0 auto;
      max-height: 46vh;
      overflow-y: auto;
      margin: 10px 0 12px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--container-bg);
    }
    .card-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .card-head h3 { margin: 0; }
    .composer-dock .agent-section { margin: 0; padding: 0; border: 0; border-radius: 0; background: transparent; }
    .composer-dock .agent-section + .agent-section { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
    .composer-dock .agent-section h3 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 650; }
    .composer-dock .agent-section:first-of-type h3 { font-size: 14px; text-transform: none; letter-spacing: 0; color: var(--text); font-weight: 650; }
    .composer-dock .agent-form { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; margin-top: 10px; }
    .composer-dock .agent-form > label { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 5px; min-width: 0; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); }
    .composer-dock .agent-form > label > textarea { width: 100%; min-height: 72px; letter-spacing: 0; }
    .composer-dock .agent-form > span { grid-column: 1; font-size: 11px; color: var(--muted); }
    .composer-dock .agent-form > button { grid-column: 2; }
    .composer-dock .agent-section select { max-width: 100%; }
    .composer-dock .command-list { list-style: none; margin: 4px 0; padding: 0; display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); }
    .composer-dock .command-list code { color: var(--text); }
    .composer-dock .agent-section > label:has(select) { display: inline-flex; align-items: center; gap: 6px; margin: 0 8px 0 0; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); }
    .composer-dock .agent-section > label:has(input[type="checkbox"]) { display: flex; align-items: flex-start; gap: 8px; margin: 10px 0; font-size: 12px; color: var(--text); }
    .composer-dock .agent-section > label:has(input[type="checkbox"]) input { margin: 3px 0 0; }
    .notice:empty, .result:empty { display: none; }
    .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    #status, #auth-note { min-height: 18px; color: var(--dim); }
    #status[data-error="true"] { color: var(--error); }
    #pairing { margin: 8px 0 14px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--warning); }
    #auth {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      max-width: 380px;
      margin: 6px 0 14px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--container-bg);
    }
    #auth label { color: var(--dim); font-size: 12px; }
    #auth input { width: 100%; }
    .session-heading { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .session-heading h2 { overflow-wrap: anywhere; }
    .transcript { display: flex; flex-direction: column; gap: 14px; padding: 14px 0; }
    .entry { min-width: 0; }
    .entry-meta { display: flex; gap: 10px; margin-bottom: 5px; color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
    .entry-role { font-weight: 700; color: var(--accent); }
    .entry.assistant .entry-role { color: var(--success); }
    .entry.tool-result .entry-role, .entry.meta-entry .entry-role { color: var(--muted); }
    .entry-body { max-width: 75ch; overflow-wrap: anywhere; white-space: pre-wrap; font-size: 14px; line-height: 21px; font-family: var(--font-mono); }
    .entry.user .entry-body { padding: 8px 10px; background: var(--userMessageBg); color: var(--userMessageText); }
    .entry.assistant .entry-body { padding: 0; }
    .entry.tool-call, .entry.tool-result, .entry.meta-entry { padding: 7px 10px; background: var(--info-bg); }
    .entry.tool-call { background: var(--toolPendingBg); }
    .entry.tool-result { background: var(--toolSuccessBg); }
    .entry.tool-result.failed { background: var(--toolErrorBg); }
    details.tool-payload { margin-top: 6px; color: var(--dim); }
    details.tool-payload summary { cursor: pointer; }
    pre { margin: 6px 0 0; max-width: 100%; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text); font: inherit; }
    .transcript-actions { display: flex; gap: 8px; padding-top: 2px; }
    .management-heading { padding: 14px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .agent-section {
      margin: 10px 0;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--container-bg);
    }
    .agent-title { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .agent-title h2 { font-size: 14px; }
    .agent-host { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
    .chip { padding: 2px 8px; border: 1px solid var(--border); border-radius: 999px; background: var(--info-bg); font-size: 11px; color: var(--muted); white-space: nowrap; }
    .chip-on { color: var(--success); }
    .chip-off, .chip-unknown { color: var(--warning); }
    .agent-section h3 { margin: 12px 0 5px; }
    .control-copy { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--dim); }
    .control-copy input { font-family: var(--font-mono); font-size: 11px; text-transform: none; }
    .job { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 0; border-top: 1px solid var(--border); }
    .job-line { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; font-family: var(--font-mono); font-size: 12px; }
    .job form, .agent-form { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; margin-top: 8px; }
    #agents .agent-form { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; margin-top: 12px; }
    #agents .agent-form label { display: flex; flex-direction: column; align-items: stretch; gap: 5px; min-width: 0; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); }
    #agents .agent-form label > input, #agents .agent-form label > textarea, #agents .agent-form label > select { width: 100%; text-transform: none; letter-spacing: 0; }
    #agents .agent-form p { font-size: 11px; text-transform: none; letter-spacing: 0; }
    #agents .agent-form > button { justify-self: start; }
    .agent-form textarea { width: min(100%, 420px); }
    .agent-form input { width: min(100%, 320px); }
    .start-review { flex-basis: 100%; }
    .start-review button { margin: 8px 8px 0 0; }
    .result { margin: 6px 0; color: var(--warning); white-space: pre-wrap; overflow-wrap: anywhere; }
    .result.success { color: var(--success); }
    .notice { margin: 8px 0; padding: 8px 10px; border-radius: 6px; background: var(--info-bg); color: var(--dim); overflow-wrap: anywhere; }
    .notice.warning { color: var(--warning); }
    [hidden] { display: none !important; }
    @media (max-width: 1000px) {
      .topbar .nav-btn { display: inline-flex; }
      .workspace { grid-template-columns: minmax(0, 1fr); }
      .workspace > .sidebar, .workspace > .content, .workspace > .agents-pane { display: none; }
      .workspace[data-view="sessions"] > .sidebar { display: flex; }
      .workspace[data-view="session"] > .content { display: flex; }
      .workspace[data-view="agents"] > .agents-pane { display: flex; }
      .sidebar, .agents-pane { border-left: 0; border-right: 0; }
      #transcript-panel { padding: 0 12px; }
      .content-head { padding: 10px 12px 0; }
      .agent-form label { width: 100%; }
      .composer-dock { max-height: 55vh; }
      button { min-height: 34px; }
    }
    @media (max-width: 640px) {
      .topbar { flex-wrap: wrap; }
      .session-heading { align-items: flex-start; flex-direction: column; gap: 2px; }
      .composer-dock .agent-section > label:has(select) { display: flex; flex-direction: column; align-items: stretch; gap: 5px; margin: 0 0 8px; }
      .composer-dock .agent-section select { width: 100%; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .entry { animation: arrive .18s ease-out both; }
      @keyframes arrive { from { opacity: .65; transform: translateY(3px); } to { opacity: 1; transform: none; } }
    }
    .live-tail { margin-top: 6px; padding-top: 6px; border-top: 1px dashed rgba(128,128,128,.45); }
    .live-banner { font-size: 11px; opacity: .7; letter-spacing: .02em; margin: 0 0 6px; text-transform: uppercase; }
    .entry.live { opacity: .95; }
  </style>
</head>
<body>
  <header class="topbar">
    <button id="nav-sessions" class="nav-btn" type="button">Sessions</button>
    <h1 id="title">Pi Mesh</h1>
    <button id="pair" type="button">Pair agent</button>
    <button id="sync" type="button">Sync</button>
    <button id="nav-agents" class="nav-btn" type="button">Agents</button>
  </header>
  <div class="workspace" id="workspace" data-view="sessions">
    <aside class="sidebar" aria-label="Sessions">
      <div class="sidebar-head"><label for="search">Find a session</label><input id="search" type="search" placeholder="Name or project" autocomplete="off"></div>
      <nav id="session-list" aria-label="Recent sessions"></nav>
    </aside>
    <main class="content">
      <div class="content-head">
        <form id="auth" hidden>
          <label for="auth-token">Paste dashboard token</label>
          <input id="auth-token" type="password" autocomplete="off" placeholder="pi-mesh-control-plane token">
          <button type="submit">Connect</button>
        </form>
        <p id="auth-note" role="status"></p>
        <p id="status" role="status"></p>
        <p id="pairing"></p>
        <p id="transcript-status" role="status" aria-live="polite"></p>
        <p id="live-status" role="status" aria-live="polite"></p>
      </div>
      <section id="transcript-panel" hidden></section>
    </main>
    <aside class="agents-pane" aria-label="Agents and jobs">
      <section id="agents"></section>
    </aside>
  </div>
<script>
(() => {
  // Paste the dashboard token once; it stays in localStorage and is sent only
  // as X-Pi-Mesh-Ui, never read from or written into a URL.
  let token = localStorage.getItem('pi_mesh_token') || '';
  const root = document.querySelector('#agents');
  const sessionList = document.querySelector('#session-list');
  const transcriptPanel = document.querySelector('#transcript-panel');
  const workspace = document.querySelector('#workspace');
  const messages = new Map();
  // Below 1000px only one pane is shown; these switches pick it. On a wide
  // screen the attribute is inert and all three panes are visible.
  function showView(view) { workspace.dataset.view = view; }
  document.querySelector('#nav-sessions').addEventListener('click', () => showView('sessions'));
  document.querySelector('#nav-agents').addEventListener('click', () => showView('agents'));
  const node = (tag, text, parent) => { const e = document.createElement(tag); if(text !== undefined) e.textContent = String(text ?? ''); parent.append(e); return e; };
  function needToken(message) { showView('session'); token = ''; localStorage.removeItem('pi_mesh_token'); document.querySelector('#auth').hidden = false; document.querySelector('#auth-note').textContent = message || ''; root.replaceChildren(); sessionList.replaceChildren(); }
  async function api(path, method='GET', body, signal) {
    const r = await fetch(path, {method, headers:{'X-Pi-Mesh-Ui':token, ...(body === undefined ? {} : {'content-type':'application/json'})}, ...(body === undefined ? {} : {body:JSON.stringify(body)}), ...(signal ? {signal} : {})});
    const result = await r.json();
    if(!r.ok) { const error=Error(result.message || result.error || ('Request failed: '+r.status)); error.status=r.status; if(r.status === 401) needToken('The dashboard token was rejected. Paste it again.'); throw error; }
    return result;
  }
  let state;
  let selected;
  const relative = new Intl.RelativeTimeFormat(undefined, {numeric:'auto'});
  function ago(value) {
    const seconds = Math.round((Date.parse(value) - Date.now()) / 1000);
    const units = [[31536000,'year'],[2592000,'month'],[604800,'week'],[86400,'day'],[3600,'hour'],[60,'minute'],[1,'second']];
    for(const [size, name] of units) if(Math.abs(seconds) >= size || size === 1) return relative.format(Math.round(seconds / size), name);
    return 'unknown time';
  }
  function basename(path) { return String(path || 'unknown project').replace(/[\/]+$/, '').split(/[\/]/).pop() || 'unknown project'; }
  function visibleSessions() {
    const term = document.querySelector('#search').value.trim().toLowerCase();
    return state.sessions.filter(session => {
      const agent = state.agents.find(candidate => candidate.peer_id === session.agent_id);
      return (session.name+' '+session.session_id+' '+session.project+' '+(agent?.name || '')).toLowerCase().includes(term);
    }).sort((a,b) => Date.parse(b.updated_at) - Date.parse(a.updated_at));
  }
  function renderSessions() {
    sessionList.replaceChildren();
    if(!state) return;
    const sessions = visibleSessions();
    if(!sessions.length) { node('p', state.sessions.length ? 'No sessions match this search.' : 'No sessions synced yet.', sessionList).className = 'empty'; return; }
    let lastAgent = '';
    for(const session of sessions) {
      if(session.agent_id !== lastAgent) {
        lastAgent = session.agent_id;
        const agent = state.agents.find(candidate => candidate.peer_id === lastAgent);
        node('div', agent?.name || lastAgent, sessionList).className = 'agent-label';
      }
      const button = node('button', undefined, sessionList);
      button.type = 'button';
      button.className = 'session-link';
      button.setAttribute('aria-current', selected?.agentId === session.agent_id && selected?.sessionId === session.session_id ? 'true' : 'false');
      node('span', (session.name || session.session_id)+' - '+basename(session.project), button).className = 'session-name';
      node('span', ago(session.updated_at), button).className = 'session-age';
      button.addEventListener('click', () => void openSession(session.agent_id, session.session_id));
    }
  }
  function showMessage(parent, key) {
    const message = messages.get(key);
    if(message) node('p', message.text, parent).className = 'result';
  }
  async function act(agent, action, body, key) {
    try {
      const result = await api('/api/agents/'+encodeURIComponent(agent.peer_id)+'/'+action, 'POST', body);
      if(result.ok === false) {
        const why = result.code === -32102 ? 'This machine has not enabled execution. ' : '';
        messages.set(key, {kind:'refusal', text:why+'Agent said: “'+String(result.message ?? '')+'”'});
      } else messages.set(key, {kind:'success', text:'Action completed.'});
    } catch(error) { messages.set(key, {kind:'transport', text:error.message || 'The agent could not be reached.'}); }
    try { await load(); } catch(error) { render(); showMessage(root, key); }
  }
  function parseEntry(event) {
    if(typeof event.data !== 'string') return event.data || {};
    try { return JSON.parse(event.data); } catch { return {text:event.data}; }
  }
  function matchingUserTurn(event, message, baselineIds) {
    if(!event.entry_id || baselineIds.has(event.entry_id)) return false;
    const data = parseEntry(event);
    const payload = data.message && typeof data.message === 'object' ? data.message : data;
    if(payload.role !== 'user') return false;
    if(typeof payload.content === 'string') return payload.content === message;
    return Array.isArray(payload.content) && payload.content.some(part => part?.type === 'text' && part.text === message);
  }
  async function observePrompt(owner, baseline, submitted, current) {
    const baselineIds = new Set(baseline.events.map(event => event.entry_id).filter(Boolean));
    const deadline = Date.now() + 15000;
    while(Date.now() < deadline && selected === owner) {
      await new Promise(resolve => setTimeout(resolve, Math.min(1000, deadline-Date.now())));
      if(selected !== owner) {
        current.status = 'Accepted; observation interrupted by session switch. Delivery is unconfirmed.';
        return;
      }
      if(Date.now() >= deadline) break;
      const data = await fetchSessionPage(owner.agentId, owner.sessionId, undefined, false, AbortSignal.timeout(deadline-Date.now()));
      if(selected !== owner) {
        current.status = 'Accepted; observation interrupted by session switch. Delivery is unconfirmed.';
        return;
      }
      if(data.stale) {
        owner.transcript = data;
        current.status = 'Accepted, but the transcript could not be verified. Delivery is unconfirmed.';
        renderTranscript(data, owner);
        document.querySelector('#transcript-status').textContent = current.status;
        return;
      }
      const appended = data.total > baseline.total && data.events.some(event => matchingUserTurn(event, submitted, baselineIds));
      if(appended) {
        owner.transcript = data;
        if(current.draft === submitted) current.draft = '';
        current.status = 'Matching turn observed in this session; origin not verified.';
        renderTranscript(data, owner);
        return;
      }
    }

      current.modelsGeneration += 1;
      current.modelsLoading = false;
    }
  }
  // Command hints are a per-job snapshot too: a reload drops them so the card
  // re-reads rather than showing a list from before the reload (ADR 0017).
  function invalidateCommandHints() {
    for(const current of promptStates.values()) {
      current.commands = null;
      current.commandsJobId = '';
      current.commandsFailed = false;
      current.commandsStatus = '';
      current.sessionStatus = null;
      current.sessionStatusJobId = '';
      current.sessionStatusFailed = false;
      current.sessionStatusMessage = '';
      // Retire in-flight reads too, in defence in depth: the next load bumps the
      // generation anyway, but a response for a superseded snapshot must not be
      // able to apply in the gap before that.
      current.commandsRequest += 1;
      current.sessionStatusRequest += 1;
    }
  }
  function renderAgent(agent) {
    const jobs = state.jobs.filter(job => job.agent_id === agent.peer_id);
    const section = node('section', undefined, root);
    section.className = 'agent-section';
    const head = node('header', undefined, section);
    head.className = 'agent-title';
    node('h2', agent.name, head);
    node('span', agent.host+':'+agent.port, head).className = 'agent-host';
    const capable = agent.controls.spawn;
    const chip = node('span', agent.skills === null ? 'capability unknown' : capable ? 'execution enabled' : 'execution not advertised', head);
    chip.className = 'chip '+(agent.skills === null ? 'chip-unknown' : capable ? 'chip-on' : 'chip-off');
    if(jobs.length) node('span', jobs.length+(jobs.length === 1 ? ' job' : ' jobs'), head).className = 'chip';
    if(!capable) {
      const controlLabel = node('label', 'Control id to copy ', section);
      controlLabel.className = 'control-copy';
      const controlId = node('input', undefined, controlLabel); controlId.readOnly = true; controlId.value = state.control.id;
      const copy = node('button', 'Copy id', section);
      copy.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(state.control.id); copy.textContent = 'Copied'; }
        catch { controlId.select(); copy.textContent = 'Select and copy'; }
      });
      node('p', 'Start the agent with --allow-execution='+state.control.id, section).className = 'dim hint';
    }
    if(capable) {
      const current = spawnState(agent.peer_id);
      const projects = [...new Set([
        ...state.sessions.filter(session => session.agent_id === agent.peer_id).map(session => session.project),
        ...state.jobs.filter(job => job.agent_id === agent.peer_id).map(job => job.project),
      ].filter(project => typeof project === 'string' && project.trim()))];
      const form = node('form', undefined, section); form.className = 'agent-form';
      const projectLabel = node('label', 'Project ', form); const project = node('input', undefined, projectLabel); project.required = true; project.value = current.project; project.setAttribute('list', 'projects-'+agent.peer_id);
      const suggestions = node('datalist', undefined, form); suggestions.id = 'projects-'+agent.peer_id;
      for(const value of projects) { const option = node('option', undefined, suggestions); option.value = value; option.label = basename(value); }
      if(projects.length) node('p', 'Suggestions from cached sessions and jobs for this agent; cached is not live.', form).className = 'dim';
      else node('p', 'No cached projects for this agent yet. Enter a project name.', form).className = 'dim';
      const promptLabel = node('label', 'Prompt ', form); const prompt = node('textarea', undefined, promptLabel); prompt.required = true; prompt.value = current.prompt;
      const cwdLabel = node('label', 'Working directory (optional) ', form); const cwd = node('input', undefined, cwdLabel); cwd.value = current.cwd;
      // A choice is cleared only when a CONFIRMED list no longer contains it; a
      // reload that has not re-fetched (models === null) keeps the reviewed choice
      // visible as re-checking and blocks submission until the fresh list confirms
      // it, so a refusal keeps the operator's review for a retry.
      function spawnModelUnconfirmed(){ return current.model !== null && current.models === null; }
      const modelLabel = node('label', 'Model ', form); const modelSelect = node('select', undefined, modelLabel);
      const modelHint = node('p', '', form); modelHint.className = 'dim hint';
      // Update the model control IN PLACE. The catalog arrives asynchronously and
      // must NOT trigger a whole-form re-render: that rebuilds the inputs and can
      // drop what the operator had typed while the request was in flight.
      function applySpawnModels() {
        const list = Array.isArray(current.models) ? current.models.filter(usableModel) : [];
        const match = current.model ? list.find(choice => choice.provider === current.model.provider && choice.id === current.model.model_id) : null;
        if(current.model && !match && current.models !== null){ current.model = null; current.review = null; }
        modelSelect.replaceChildren();
        const none = node('option', "Use this machine's default", modelSelect); none.value = '';
        for(const choice of list) { const option = node('option', choice.name+' — '+choice.provider+'/'+choice.id, modelSelect); option.value = JSON.stringify({provider:choice.provider, model_id:choice.id}); }
        if(current.model) {
          if(match) modelSelect.value = JSON.stringify({provider:match.provider, model_id:match.id});
          else if(current.models === null) { const option = node('option', current.model.provider+'/'+current.model.model_id+' (re-checking)', modelSelect); option.value = JSON.stringify({provider:current.model.provider, model_id:current.model.model_id}); modelSelect.value = option.value; }
        }
        const unconfirmed = spawnModelUnconfirmed();
        modelSelect.disabled = current.pending || unconfirmed || current.modelsFailed || (current.models !== null && list.length === 0);
        modelHint.textContent = current.models && current.models.length
          ? 'Model list from this agent ('+ageLabel(Date.now() - current.modelsAt)+'); a snapshot, re-checked on each reload.'
          : (current.modelStatus || '');
        reviewButton.disabled = current.pending || unconfirmed || !project.value.trim() || !prompt.value.trim();
        submit.disabled = current.pending || unconfirmed;
      }
      project.disabled = prompt.disabled = cwd.disabled = current.pending;
      const reviewButton = node('button', 'Review start', form); reviewButton.type = 'button'; reviewButton.hidden = !!current.review;
      const review = node('div', undefined, form); review.className = 'start-review notice'; review.hidden = !current.review;
      const reviewText = node('p', '', review);
      const submit = node('button', 'Start', review); submit.type = 'submit'; submit.disabled = current.pending;
      const cancel = node('button', 'Cancel', review); cancel.type = 'button'; cancel.disabled = current.pending;
      // reviewButton/submit exist now, so paint the control and fetch the list.
      applySpawnModels();
      loadSpawnModels(agent, current, applySpawnModels);
      function showReview() {
        review.hidden = !current.review;
        reviewButton.hidden = !!current.review;
        reviewText.textContent = current.review ? 'Start one session on '+agent.name+' for '+current.review.project+(current.review.cwd ? ' in '+current.review.cwd : '')+(current.review.model ? ' using '+current.review.model.provider+'/'+current.review.model.model_id : '')+'?' : '';
      }
      showReview();
      modelSelect.addEventListener('change', () => {
        try { const parsed = JSON.parse(modelSelect.value); current.model = {provider:parsed.provider, model_id:parsed.model_id}; }
        catch { current.model = null; }
        current.review = null;
        showReview();
        reviewButton.disabled = current.pending || spawnModelUnconfirmed() || !project.value.trim() || !prompt.value.trim();
      });
      for(const [input, key] of [[project, 'project'], [prompt, 'prompt'], [cwd, 'cwd']]) input.addEventListener('input', () => {
        current[key] = input.value;
        current.review = null;
        showReview();
        reviewButton.disabled = current.pending || spawnModelUnconfirmed() || !project.value.trim() || !prompt.value.trim();
      });
      reviewButton.addEventListener('click', () => {
        if(current.pending || spawnModelUnconfirmed() || !current.project.trim() || !current.prompt.trim()) return;
        // Built from state, not the DOM: an async catalog reload can rebuild the
        // inputs underneath the click, and the reviewed values must be the ones
        // the operator entered.
        current.review = {project:current.project, prompt:current.prompt, cwd:current.cwd, model:current.model};
        showReview(); submit.focus();
      });
      cancel.addEventListener('click', () => { current.review = null; showReview(); reviewButton.focus(); });
      const pendingStatus = node('p', current.pending ? 'Starting session…' : '', section); pendingStatus.className = 'result'; pendingStatus.setAttribute('role', 'status'); pendingStatus.setAttribute('aria-live', 'polite');
      form.addEventListener('submit', async event => {
        event.preventDefault();
        const approved = current.review;
        // A chosen model must not be submitted against a catalog that a reload
        // has invalidated: the previous form can still be on screen while
        // /api/state is in flight, so the live state is checked here, not the
        // captured render.
        if(current.pending || !approved || (approved.model && current.models === null) || approved.project !== current.project || approved.prompt !== current.prompt || approved.cwd !== current.cwd || JSON.stringify(approved.model ?? null) !== JSON.stringify(current.model ?? null)) return;
        current.pending = true;
        current.outcome = {kind:'pending', text:'Starting session…'};
        submit.disabled = cancel.disabled = project.disabled = prompt.disabled = cwd.disabled = modelSelect.disabled = true;
        pendingStatus.textContent = 'Starting session…';
        try {
          const response = await api('/api/agents/'+encodeURIComponent(agent.peer_id)+'/spawn', 'POST', {project:approved.project, prompt:approved.prompt, ...(approved.cwd ? {cwd:approved.cwd} : {}), ...(approved.model ? {model:{provider:approved.model.provider, model_id:approved.model.model_id}} : {})});
          if(response.ok === false) current.outcome = {kind:'refusal', text:'Agent refusal ('+String(response.code)+'): '+String(response.message ?? '')};
          else { current.outcome = {kind:'success', ...response.result}; current.review = null; }
        } catch(error) {
          current.outcome = {kind:'transport', text:error.status === 403 ? 'Control-plane transport refusal: confidential_transport_required.' : error.status === 502 ? 'Agent call failed (502): '+error.message : error.message || 'Agent call failed.'};
        } finally {
          current.pending = false;
          try { await load(); } catch { render(); }
        }
      });
      if(current.outcome?.kind === 'success') {
        const outcome = node('p', 'Started job '+current.outcome.job_id+', session '+current.outcome.session_id+', PID '+String(current.outcome.pid ?? 'unknown')+'.', section); outcome.className = 'result success'; outcome.setAttribute('role', 'status');
        const open = node('button', 'Open session', section); open.addEventListener('click', () => void openSession(agent.peer_id, current.outcome.session_id));
        if(!state.sessions.some(session => session.agent_id === agent.peer_id && session.session_id === current.outcome.session_id))
          node('p', 'Session not in the cached list yet. Open to check it, or Sync to add it to the list.', section).className = 'dim';
      } else if(current.outcome) {
        const outcome = node('p', current.outcome.text, section); outcome.className = 'result'; outcome.setAttribute('role', 'status');
      }
    }
    const jobsFresh = typeof agent.jobs_synced_at === 'number';
    const jobsAge = jobsFresh ? Date.now() - agent.jobs_synced_at : 0;
    const jobsAgeLabel = jobsAge < 60_000 ? Math.floor(jobsAge / 1000)+'s ago' : Math.floor(jobsAge / 60_000)+'m ago';
    node('h3', jobsFresh ? 'Jobs — from the agent ('+jobsAgeLabel+')' : 'Jobs — cached, not synced from this agent', section);
    if(jobs.length === 0) node('p', jobsFresh ? 'No jobs reported by the agent.' : 'No cached jobs.', section).className = 'dim';
    for(const job of jobs) {
      const item = node('div', undefined, section); item.className = 'job';
      node('p', job.project+' — '+job.job_id+' ('+job.state+(jobsFresh ? '' : ' (last known)')+')', item).className = 'job-line';
      const key = agent.peer_id+':'+job.job_id;
      if(agent.controls.stop) { const stop = node('button', 'Stop', item); stop.addEventListener('click', () => void act(agent, 'stop', {job_id:job.job_id}, key+':stop')); }
      if(agent.controls.abort) { const abort = node('button', 'Abort', item); abort.addEventListener('click', () => void act(agent, 'abort', {job_id:job.job_id}, key+':abort')); }
      showMessage(item, key+':stop'); showMessage(item, key+':abort');
    }
  }
  function render() {
    root.replaceChildren(); if(!state) return;
    document.querySelector('#title').textContent = state.control.name;
    showTransportNotice();
    renderSessions();
    if(selected) {
      const session = state.sessions.find(item => item.agent_id === selected.agentId && item.session_id === selected.sessionId);
      if(session && transcriptPanel.hidden === false) void refreshSelected();
    }
    node('h2', 'Agent management', root).className = 'management-heading';
    if(state.agents.length === 0) node('p', 'No paired agents yet. Pair an agent to begin.', root).className = 'dim';
    for(const agent of state.agents) renderAgent(agent);
  }
  let refreshPending = false;
  async function refreshSelected() {
    if(refreshPending || !selected) return;
    refreshPending = true;
    const current = selected;
    try {
      const data = await fetchSessionPage(current.agentId, current.sessionId);
      if(selected === current) renderTranscript(data, current);
    } catch {} finally { refreshPending = false; }
  }
  async function load(){ invalidateSpawnModels(); invalidateCommandHints(); state=await api('/api/state'); render(); }
  async function sync(){ await api('/api/sync','POST'); await load(); }
  document.querySelector('#search').addEventListener('input', renderSessions);
  document.querySelector('#sync').addEventListener('click', async()=>{ try { await sync(); document.querySelector('#status').textContent=''; document.querySelector('#status').removeAttribute('data-error'); } catch(e){ const status=document.querySelector('#status'); status.textContent=e.message; status.dataset.error='true'; } });
  document.querySelector('#pair').addEventListener('click', async()=>{ try { const result=await api('/api/pair/token','POST'); document.querySelector('#pairing').textContent='Token: '+result.token+'\nRun on the agent: pi-mesh-agent pair '+result.token+' --control-host '+location.hostname+':'+location.port; } catch(e){ document.querySelector('#pairing').textContent=e.message; } });
  document.querySelector('#auth').addEventListener('submit', event => {
    event.preventDefault(); token = document.querySelector('#auth-token').value.trim();
    if(!token) return;
    localStorage.setItem('pi_mesh_token', token); void connect();
  });
  async function connect() {
    try { await load(); document.querySelector('#auth').hidden = true; document.querySelector('#auth-note').textContent = ''; }
    catch(error) { if(error.status !== 401) { document.querySelector('#auth').hidden = true; root.textContent = error.message; } }
  }
  if(!token) needToken('Paste the dashboard token to connect. Get it with: pi-mesh-control-plane token');
  else void connect();
})();
</script>
</body>
</html>
